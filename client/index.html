<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Saral Shiksha — Accessible Learning Platform for every learner" />
    <title>Saral Shiksha — Accessible Learning</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
  </head>
  <body>
    <!-- Accessibility: Skip to main content link (WCAG 2.4.1) -->
    <a
      href="#main-content"
      class="skip-link"
      style="position:absolute;top:-100px;left:0;background:#4f46e5;color:#fff;padding:8px 16px;border-radius:0 0 8px 0;z-index:9999;font-weight:600;transition:top 0.2s;"
      onfocus="this.style.top='0'"
      onblur="this.style.top='-100px'"
    >
      Skip to main content
    </a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
